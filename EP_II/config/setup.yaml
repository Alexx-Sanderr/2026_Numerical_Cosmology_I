# ==========================================
# Configuration Setup - Numerical Cosmology EP_II
# ==========================================

#____________________ Cosmology ____________________#

cosmology:
  h: 0.6737
  Omega_b: 0.0493           # 0.02237 / h^2
  Omega_cdm: 0.2657         # 0.1200 / h^2
  Omega_m: 0.315            # Omega_b + Omega_cdm
  Omega_r: 0.0
  Omega_lambda: 0.685 
  w0_fld: -1.0
  wa_fld: 0.0 

#____________________ Primordial Spectrum ____________________#

primordial:
  A_s: 2.1e-9               # Amplitude das perturbações escalares
  n_s: 0.9649               # Índice espectral escalar
  k_pivot: 0.05             # Escala de pivô [1/Mpc]

#____________________ Linear Growth ____________________#

growth:
  a_i: 1.0e-4
  a_f: 1.0
  num_points: 400
  solver:
    rtol: 1.0e-8
    atol: 1.0e-10

#____________________ SPT ____________________#

spt:
  box_size_L: 500.0       
  grid_Ng: 128             
  scale_factor_aref: 1.0  
  
  pk_num_bins: 20
  bispectrum_num_bins: 12

  skewness:
    R_min: 4.0
    R_max: 12.0
    num_radii: 9

#_________________ SPT Multiple Realizations _________________#

ensemble:
  num_realizations: 25
  seed_start: 12345

#_________________ LPT / Zel'dovich _________________#

lpt:
  box_size_L: 200.0          # Tamanho da caixa de simulação [Mpc/h]
  grid_Ng: 128               # Resolução da grade por dimensão (N^3 partículas)
  scale_factor_aref: 1.0     # Fator de escala de referência
  a_ini: 0.01                # Fator de escala inicial
  a_target: 1.0              # Fator de escala final para avaliação
  seed: 42                   # Semente aleatória para o campo gaussiano
  assignment_scheme: "ngp"   # Esquema de atribuição de massa em grade ('ngp' ou 'cic')
  pk_num_bins: 25            # Número de bins para o espectro 1D

#_________________ Spherical Collapse _________________#

spherical_collapse:
  ai: 1.0e-3                 # Fator de escala inicial
  z_c: 0.0                   # Redshift alvo de colapso
  delta_stop: 1.0e4          # Critério de parada / singularidade
  default_model: "C"         # Formulação padrão ('A', 'B' ou 'C')
  f_i: 1.0                   # Taxa de crescimento inicial
  n_points: 1000             # Número de pontos na malha de integração
  shooting:
    delta_i_min: 1.0e-8      # Limite inferior de busca por bisseção
    delta_i_max: 1.0e-1      # Limite superior de busca por bisseção
    tol: 1.0e-10             # Tolerância para convergência do delta_i
    max_iter: 100            # Número máximo de iterações do shooting

#_________________ Boltzmann Solvers _________________#

boltzmann:
  default_solver: "class"   # 'class' ou 'camb'
  z_output: 0.0
  non_linear: "none"
  gauge: "newtonian"      # 'synchronous' ou 'newtonian'
  
  k_sampling:
    k_min: 1.0e-4           # [h/Mpc]
    k_max: 10.0             # [h/Mpc]
    num_points: 200

  precision_test:
    rtol: 1.0e-8
    atol: 1.0e-10
    k_per_decade_for_pk: 100

#_________________ Superhorizon Potential _________________#

superhorizon_potential:
  y_i: 1.0e-4               # y = a / a_eq
  y_f: 1.0e3
  solver:
    rtol: 1.0e-10
    atol: 1.0e-12

#_________________ Output Settings _________________#

output:
  root: "analysis/output"
  base_name: "Test"